interface:
  display_name: "Grill Me"
  short_description: "Sharpen a plan through interview"
  long_description: >
    User-invoked alias for grilling: a round-based interview that stress-tests
    a plan or design until every branch of the design tree is resolved. The
    user answers each round's questions (each with a recommended default) in a
    batch before the next round begins. Not model-invoked.
policy:
  allow_implicit_invocation: false